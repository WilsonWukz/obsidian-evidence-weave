name: Publish Community Release (manual)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact manifest version without v prefix, e.g. 0.5.0'
        required: true
        type: string
permissions:
  contents: write
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test
        run: npm run check
      - name: Validate release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          VERSION=$(node -p "require('./manifest.json').version")
          test "$REQUESTED_VERSION" = "$VERSION"
          test "$VERSION" = "$(node -p "require('./package.json').version")"
          git diff --exit-code -- main.js
          test -z "$(git status --porcelain)"
          for f in main.js manifest.json styles.css LICENSE README.md; do test -s "$f"; done
      - name: Publish version-tagged GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if gh release view "$REQUESTED_VERSION" >/dev/null 2>&1; then
            echo 'Release with this tag already exists. Increment the version first.' >&2
            exit 1
          fi
          gh release create "$REQUESTED_VERSION" main.js manifest.json styles.css \
            --target "$GITHUB_SHA" --title "EvidenceWeave $REQUESTED_VERSION" \
            --notes-file RELEASE_NOTES.md --latest
