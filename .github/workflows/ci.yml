name: Check EvidenceWeave native Graph integration
on:
  push:
  pull_request:
jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm test
      - run: test -s main.js && test -s manifest.json && test -s styles.css
